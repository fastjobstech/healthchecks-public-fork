version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-dev-only:
        applies-to: security-updates
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["patch", "minor"]
      security-safe:
        applies-to: security-updates
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["patch", "minor"]
